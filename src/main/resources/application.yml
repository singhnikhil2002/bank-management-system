spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bank_cms
    username: bank_user
    password: bank_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# JWT secret — in production this comes from AWS Secrets Manager / Vault, never hardcoded
jwt:
  secret: "your-super-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm"
  expiration: 900000
  refresh-expiration: 604800000

logging:
  level:
    root: DEBUG
    com:
      bank:
        cms: DEBUG
    org:
      springframework:
        security: DEBUG