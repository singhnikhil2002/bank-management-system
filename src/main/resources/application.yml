server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bank_cms
    username: bank_user
    password: bank_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# JWT Configuration
jwt:
  secret: "your-super-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm"
  expiration: 900000
  refresh-expiration: 604800000

# Logging Configuration
logging:
  level:
    root: DEBUG
    com:
      bank:
        cms: DEBUG
    org:
      springframework:
        security: DEBUG
